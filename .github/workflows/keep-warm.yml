# A free Render instance sleeps after 15 idle minutes and the next visitor waits
# through a cold start. This pings it during the hours it is most likely opened.
# Scheduled runs are best-effort and stop after 60 days without repository activity.
name: Keep the app warm
on:
  schedule:
    - cron: "*/10 11-23 * * *"   # every ten minutes, 07:00-19:00 Eastern
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://service-ops-sla.onrender.com/api/health || true)
            echo "attempt $attempt: $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 0   # a missed ping is not a build failure
