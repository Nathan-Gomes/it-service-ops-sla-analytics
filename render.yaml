services:
  - type: web
    name: service-ops-sla
    runtime: python
    plan: free
    buildCommand: pip install . && serviceops build
    startCommand: uvicorn serviceops.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
